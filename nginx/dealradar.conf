# ============================================================
# DealRadar.fit — Nginx Reverse Proxy Configuration
#
# This file is included (via `include /etc/nginx/conf.d/*.conf;`)
# in the main nginx.conf on the Hetzner VPS.
#
# It routes:
#   /              → dealradar-frontend:3000 (React SPA)
#   /api/v1/       → dealradar-api:8001 (FastAPI backend)
#   /sitemap.xml   → dealradar-api:8001 (SEO)
#   /robots.txt    → dealradar-api:8001 (SEO)
# ============================================================

# ------------------------------------------------------------------
# UPSTREAMS — Define backend service pools
# ------------------------------------------------------------------
upstream dealradar_frontend {
    server dealradar-frontend:3000;
    keepalive 32;
}

upstream dealradar_api {
    server dealradar-api:8001;
    keepalive 32;
}

# ------------------------------------------------------------------
# MAIN SERVER BLOCK — DealRadar.fit
# ------------------------------------------------------------------
server {
    listen 80;
    server_name dealradar.fit www.dealradar.fit;

    # Access + error logs
    access_log /var/log/nginx/dealradar-access.log;
    error_log  /var/log/nginx/dealradar-error.log;

    # Maximum upload size (for any file uploads)
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml;
    gzip_min_length 256;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------
    # API ROUTES — Proxy to FastAPI backend (BEFORE / for specificity)
    # --------------------------------------------------------------

    # DealRadar API v1
    location /api/v1/ {
        proxy_pass         http://dealradar_api/api/v1/;
        proxy_http_version 1.1;

        # Connection keepalive
        proxy_set_header   Connection "";

        # Standard forwarded headers
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # --------------------------------------------------------------
    # SEO / STATIC FILES — Proxy to API for dynamic generation
    # --------------------------------------------------------------

    location = /sitemap.xml {
        proxy_pass         http://dealradar_api/api/v1/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    15s;

        # Cache sitemap for 1 hour
        proxy_cache_valid 200 1h;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location = /robots.txt {
        proxy_pass         http://dealradar_api/api/v1/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    15s;

        # Cache robots.txt for 24 hours
        proxy_cache_valid 200 24h;
    }

    # --------------------------------------------------------------
    # FRONTEND — All other routes → React SPA
    # --------------------------------------------------------------

    location / {
        proxy_pass         http://dealradar_frontend;
        proxy_http_version 1.1;

        # Connection keepalive
        proxy_set_header   Connection "";

        # Standard forwarded headers
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # WebSocket support (for Vite HMR in dev, ignored in prod)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # --------------------------------------------------------------
    # STATIC ASSETS — Served directly by frontend Nginx,
    # but we add aggressive caching here as a second layer
    # --------------------------------------------------------------

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass         http://dealradar_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;

        # Long-term caching for hashed assets
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }
}

