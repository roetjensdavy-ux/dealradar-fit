#     ssl_certificate_key /etc/letsencrypt/live/dealradar.fit/privkey.pem;
#     ssl_trusted_certificate /etc/letsencrypt/live/dealradar.fit/chain.pem;
#
#     include /etc/nginx/snippets/ssl-params.conf;
#     include /etc/nginx/conf.d/dealradar-locations.conf;
